<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghubungkan ke WhatsApp...</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7f9;
            font-family: Arial, sans-serif;
        }

        .loading {
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 35px;
        }

        h2 {
            color: #222;
            margin-bottom: 8px;
        }

        p {
            color: #777;
        }
    </style>
</head>

<body>

    <div class="loading">
        <div class="icon">💬</div>

        <h2>Menghubungkan ke WhatsApp...</h2>

        <p>Mohon tunggu sebentar</p>
    </div>

    <script>
        const nomor = "6285257071380";

        const pesan = "Halo kak, saya mau order.";

        const whatsapp =
            "https://wa.me/" +
            nomor +
            "?text=" +
            encodeURIComponent(pesan);

        // Direct redirect ke WhatsApp
        window.location.replace(whatsapp);
    </script>

</body>
</html>
