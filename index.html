<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hubungi Customer Service</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #f5f7fa
                );
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .whatsapp-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #25D366;
            color: white;
            border-radius: 50%;

            font-size: 35px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.30);
        }

        .header h1 {
            color: #17202a;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #273444;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            border: 1.5px solid #d9dee5;
            border-radius: 12px;
            padding: 14px 16px;

            font-size: 15px;
            font-family: inherit;
            color: #1f2937;

            outline: none;
            transition: 0.2s ease;

            background: #fafafa;
        }

        input:focus,
        textarea:focus {
            border-color: #25D366;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.10);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .phone-wrapper {
            position: relative;
        }

        .phone-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);

            color: #6b7280;
            font-size: 15px;
            pointer-events: none;
        }

        #nomor {
            padding-left: 48px;
        }

        .button {
            width: 100%;
            border: none;
            border-radius: 12px;

            padding: 16px;

            background: #25D366;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            transition: all 0.2s ease;

            box-shadow: 0 8px 18px rgba(37, 211, 102, 0.25);
        }

        .button:hover {
            background: #1ebe5d;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.30);
        }

        .button:active {
            transform: translateY(0);
        }

        .button-icon {
            font-size: 20px;
        }

        .info {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;

            background: #f0fdf4;
            color: #166534;

            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 23px;
            }

            .whatsapp-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">

            <div class="whatsapp-icon">
                ☎
            </div>

            <h1>Hubungi Customer Service</h1>

            <p>
                Ada pertanyaan atau ingin melakukan pemesanan?
                Silakan hubungi customer service kami melalui WhatsApp.
            </p>

        </div>


        <form id="whatsappForm">

            <div class="form-group">

                <label for="nomor">
                    Nomor WhatsApp
                </label>

                <div class="phone-wrapper">

                    <span class="phone-prefix">
                        +62
                    </span>

                    <input
                        type="tel"
                        id="nomor"
                        value="85257071380"
                        placeholder="81234567890"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="pesan">
                    Pesan
                </label>

                <textarea
                    id="pesan"
                    placeholder="Tulis pesan Anda..."
                    required
                >Halo kak, saya mau order.</textarea>

            </div>


            <button
                type="submit"
                class="button"
            >
                <span class="button-icon">💬</span>

                Chat dengan Customer Service
            </button>

        </form>


        <div class="info">
            🔒 Anda akan diarahkan langsung ke WhatsApp
            untuk melanjutkan percakapan.
        </div>

    </div>


    <div class="footer">
        © 2026 Customer Service • Layanan Online
    </div>

</div>


<script>

    document
        .getElementById("whatsappForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let nomor = document
                .getElementById("nomor")
                .value
                .replace(/\D/g, "");

            let pesan = document
                .getElementById("pesan")
                .value
                .trim();


            // Jika user memasukkan 08xxxxxxxx
            if (nomor.startsWith("0")) {
                nomor = "62" + nomor.substring(1);
            }

            // Jika user memasukkan 852xxxx
            else if (!nomor.startsWith("62")) {
                nomor = "62" + nomor;
            }


            // Encode pesan agar aman digunakan di URL
            let pesanEncoded = encodeURIComponent(pesan);


            // Membuat URL WhatsApp
            let whatsappURL =
                "https://wa.me/" +
                nomor +
                "?text=" +
                pesanEncoded;


            // Redirect ke WhatsApp
            window.location.href = whatsappURL;

        });

</script>

</body>
</html>
